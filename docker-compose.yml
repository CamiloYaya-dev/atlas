services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: atlas
    volumes: [atlas_dev_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 3s
      timeout: 3s
      retries: 30
  db_test:
    image: postgres:16-alpine
    profiles: ["test"]
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_test_only
      POSTGRES_DB: atlas_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_test"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  atlas_dev_data:
