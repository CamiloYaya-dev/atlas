# Mantiene identificadores físicos históricos de PostgreSQL para reutilizar los datos existentes.
# El nombre de marca, API, tablas y paquetes ya es NOVZI; NO eliminar el volumen.
# Evita que un director renombrado cree por accidente otra BD y parezca que perdió los datos.
name: atlas
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: atlas
    volumes: [atlas_dev_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 3s
      timeout: 3s
      retries: 30
  db_test:
    image: postgres:16-alpine
    profiles: ["test"]
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_USER: novzi
      POSTGRES_PASSWORD: novzi_test_only
      POSTGRES_DB: novzi_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novzi -d novzi_test"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  atlas_dev_data:
