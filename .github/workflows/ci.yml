name: NOVZI - QA automatizada
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novzi
          POSTGRES_PASSWORD: novzi_test_only
          POSTGRES_DB: novzi_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U novzi -d novzi_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NODE_ENV: test
      AUTH_MODE: local
      DATABASE_URL: postgresql://novzi:novzi_test_only@127.0.0.1:5433/novzi_test
      DB_SSL: 'false'
      NOVZI_ALLOW_DB_TESTS: 'true'
      NOVZI_CSRF_SECRET: novzi-qa-only-secret-not-for-production-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: novzi-unit-integration-qa
          path: test-results/qa/
          if-no-files-found: ignore
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:local
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: novzi-e2e-artifacts
          path: test-results/
  deploy-api:
      name: Deploy API to Coolify (after QA)
      needs: [unit-and-integration, browser-e2e]
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      permissions:
        contents: read
      concurrency:
        group: novzi-api-production
        cancel-in-progress: false
      steps:
        - name: Trigger Coolify through a restricted SSH key
          env:
            CD_SSH_KEY: ${{ secrets.NOVZI_CD_SSH_KEY }}
            CD_KNOWN_HOSTS: ${{ secrets.NOVZI_CD_KNOWN_HOSTS }}
          run: |
            set -euo pipefail
            test -n "$CD_SSH_KEY" || { echo 'Missing NOVZI_CD_SSH_KEY secret'; exit 1; }
            test -n "$CD_KNOWN_HOSTS" || { echo 'Missing NOVZI_CD_KNOWN_HOSTS secret'; exit 1; }
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$CD_SSH_KEY" > "$HOME/.ssh/id_ed25519"
            printf '%s\n' "$CD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
            ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" ubuntu@15.204.95.176 deploy